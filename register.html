<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register |Tech Fest</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
  </head>

  <body
    class="min-h-screen bg-white text-gray-900 dark:bg-gray-950 dark:text-white"
  >
    <!-- Navbar -->
    <header class="border-b border-gray-200 dark:border-gray-800">
      <nav
        class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5"
      >
        <a href="index.html" class="text-2xl font-extrabold text-violet-600">
          NEXORA<span class="text-orange-500">.</span>
        </a>

        <div class="flex items-center gap-3">
          <a href="index.html" class="hover:text-violet-600"> Home </a>

          <button
            id="themeToggle"
            type="button"
            aria-label="Toggle dark mode"
            class="rounded-lg border border-gray-300 px-3 py-2 hover:bg-gray-100 dark:border-gray-700 dark:hover:bg-gray-800"
          >
            ☀️ / 🌙
          </button>
        </div>
      </nav>
    </header>

    <!-- Register -->
    <main class="mx-auto max-w-3xl px-5 py-16">
      <div class="mb-10 text-center">
        <p class="font-bold uppercase tracking-widest text-violet-600">
          Be Part of the Experience
        </p>

        <h1 class="mt-3 text-4xl font-extrabold sm:text-5xl">
          Register for NEXORA
        </h1>

        <p class="mt-4 text-gray-600 dark:text-gray-400">
          Join us for two days of technology, creativity and innovation.
        </p>
      </div>

      <!-- Form -->
      <form
        class="space-y-6 rounded-2xl border border-gray-200 bg-gray-50 p-6 dark:border-gray-800 dark:bg-gray-900 sm:p-8"
      >
        <div>
          <label for="name" class="mb-2 block font-medium"> Full Name </label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
            class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-900 dark:border-gray-700 dark:bg-gray-950 dark:text-white"
          />
        </div>

        <div>
          <label for="email" class="mb-2 block font-medium">
            Email Address
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
            class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-900 dark:border-gray-700 dark:bg-gray-950 dark:text-white"
          />
        </div>

        <div>
          <label for="college" class="mb-2 block font-medium">
            College Name
          </label>
          <input
            type="text"
            id="college"
            name="college"
            placeholder="Enter your college name"
            required
            class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-900 dark:border-gray-700 dark:bg-gray-950 dark:text-white"
          />
        </div>

        <div>
          <label for="phone" class="mb-2 block font-medium">
            Phone Number
          </label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
            class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 text-gray-900 dark:border-gray-700 dark:bg-gray-950 dark:text-white"
          />
        </div>

        <!-- Ticket-->
        <fieldset>
          <legend class="mb-3 font-medium">Choose Your Ticket</legend>

          <div class="space-y-3">
            <label class="flex items-center gap-3">
              <input type="radio" name="ticket" value="Basic" required />
              <span>Basic — ₹199</span>
            </label>

            <label class="flex items-center gap-3">
              <input type="radio" name="ticket" value="Pro" />
              <span>Pro — ₹499</span>
            </label>

            <label class="flex items-center gap-3">
              <input type="radio" name="ticket" value="VIP" />
              <span>VIP — ₹999</span>
            </label>
          </div>
        </fieldset>

        <!-- T&Cs-->
        <div>
          <label class="flex items-start gap-3">
            <input type="checkbox" name="terms" required class="mt-1" />
            <span class="text-sm text-gray-600 dark:text-gray-300">
              I agree to the event terms and conditions.
            </span>
          </label>
        </div>

        <button
          type="submit"
          class="w-full rounded-lg bg-violet-600 px-6 py-3 font-semibold text-white hover:bg-violet-700"
        >
          Complete Registration
        </button>
      </form>
    </main>

    <!-- Footer -->
    <footer
      class="border-t border-gray-200 py-6 text-center text-sm text-gray-500 dark:border-gray-800 dark:text-gray-400"
    >
      © 2026 NEXORA Tech Fest. Student project.
    </footer>

    <!-- Toggle -->
    <script>
      const themeToggle = document.getElementById("themeToggle");

      themeToggle.addEventListener("click", function () {
        document.documentElement.classList.toggle("dark");
      });
    </script>
  </body>
</html>
